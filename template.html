<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Battle</title>
  <style>
    /* CSS RESET */
    /*
      1. Use a more-intuitive box-sizing model.
    */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /*
      2. Remove default margin
    */
    * {
      margin: 0;
    }

    /*
      Typographic tweaks!
      3. Add accessible line-height
      4. Improve text rendering
    */
    body {
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    html,
    body {
      height: 100%;
      background: #000;
    }

    /* OUR CSS */
    .start-button {
      padding: 15px;
      border: none;
      background: white;
      font-size: 20px;
      font-weight: 600;
    }

    #map-creator-menu {
      position: absolute;
      right: 0;
      max-height: 100vh;
      padding: 50px;
      width: 300px;
      background-color: #444;
      overflow: auto;
    }

    #factions-list li {
      display: flex;
    }

    #factions-list label {
      display: block;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;

      display: block;
      /* make the canvas act like a block   */
      width: 100%;
      /* make the canvas fill its container */
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
      /* useful for animation between map creator and game */
    }
  </style>
</head>

<body>
  <div id="debug-panel"></div>
</body>

</html>
